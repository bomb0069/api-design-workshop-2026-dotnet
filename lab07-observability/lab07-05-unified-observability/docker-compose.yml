services:
  # --- The application services ---------------------------------------------

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PRODUCT_SERVICE_URL: http://product-service:8080
    depends_on:
      - product-service
      - otel-collector

  product-service:
    build: ./product-service
    ports:
      - "8081:8080"
    environment:
      OTEL_SERVICE_NAME: product-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector

  # --- The telemetry pipeline -----------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (also used by the services inside the network)
      - "8889:8889"   # Prometheus exporter (scraped by prometheus)
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana)

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"   # Loki API + native OTLP ingest at /otlp

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # --- Load generator (opt-in: docker compose --profile loadtest up loadtest) -

  loadtest:
    image: alpine/curl
    profiles: ["loadtest"]
    volumes:
      - ./loadtest.sh:/loadtest.sh:ro
    entrypoint: ["sh", "/loadtest.sh"]
    environment:
      TARGET_URL: http://order-service:8080
      DURATION_SECONDS: "180"
    depends_on:
      - order-service
