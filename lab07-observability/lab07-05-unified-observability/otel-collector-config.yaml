# OpenTelemetry Collector configuration.
#
# The collector is built from three kinds of components wired into pipelines:
#   receivers  — how telemetry gets IN (here: OTLP from both services)
#   processors — what happens in the middle (here: batching)
#   exporters  — where telemetry goes OUT (one backend per signal)
#
# One receiver feeds three pipelines; each pipeline fans out to the backend
# that is best at storing that signal.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch telemetry before exporting: fewer, larger outgoing requests.
  # In production you would also add memory_limiter, filter/attributes
  # processors (redaction), and tail sampling here.
  batch:

exporters:
  # Traces -> Tempo (which itself speaks OTLP on 4317).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> exposed on :8889 in Prometheus text format; Prometheus
  # scrapes the collector (pull model), the apps never see Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs -> Loki's native OTLP/HTTP ingest endpoint (Loki 3.x).
  # The exporter appends /v1/logs itself, so the endpoint is just /otlp.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
