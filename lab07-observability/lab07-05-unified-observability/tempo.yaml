# Minimal Grafana Tempo configuration (Tempo 2.4.x).
# - Receives traces over OTLP gRPC on 4317 (from the OTel Collector).
# - Serves the query API on 3200 (used by the Grafana Tempo datasource).
# - Stores blocks on local disk under /tmp/tempo (world-writable, so the
#   container works regardless of which user the image runs as).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
