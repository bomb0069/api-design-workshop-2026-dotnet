services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      SIGNING_DEBUG: "true"   # echoes X-Debug-String-To-Sign — lab only, never in production

  client:
    build: ./client
    environment:
      API_BASE: http://api:8080
    depends_on:
      - api
    restart: "no"
